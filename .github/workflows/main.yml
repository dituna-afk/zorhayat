name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Zip Cikar
        run: |
          unzip -o deneme_fixed.zip
          find . -name "gradlew" -exec chmod +x {} +

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: APK Derle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
            cd "$GRADLE_DIR"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: uygulama-debug
          path: '**/*.apk'
