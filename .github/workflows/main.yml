name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3

      - name: Zip Cikar ve Derle
        run: |
          unzip -o deneme_fixed.zip
          cd deneme-main
          gradle assembleDebug --stacktrace

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: uygulama-debug
          path: '**/build/outputs/apk/**/*.apk'
